<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TALLENTEX Class 10 - Mental Ability Practice Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .fig-box { display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans select-none min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="bg-amber-400 text-slate-950 text-[10px] font-black uppercase px-1.5 py-0.5 rounded">TALLENTEX</span>
        <h1 class="text-xs sm:text-base font-bold truncate max-w-[150px] sm:max-w-none">Class 10 Mental Ability</h1>
      </div>
      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="text-right">
          <span class="text-[10px] text-indigo-200 block leading-tight">Time Left</span>
          <span id="timerDisplay" class="font-mono font-bold text-sm sm:text-lg text-amber-300">02:30:00</span>
        </div>
        <button id="btnPauseTimer" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-2 sm:px-2.5 py-1.5 rounded shadow transition">
          ⏸ Pause
        </button>
        <button id="btnSubmitExam" class="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-2.5 sm:px-3 py-1.5 rounded shadow">
          Submit
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation / Range Bar -->
  <div class="bg-white border-b border-slate-200 shadow-sm sticky top-[49px] z-40">
    <div class="max-w-7xl mx-auto px-3 flex space-x-1.5 overflow-x-auto py-2 custom-scroll" id="rangeTabs"></div>
  </div>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-3 py-3 flex-1 flex flex-col lg:flex-row gap-3 w-full">
    
    <!-- Question Area -->
    <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col p-4 min-h-[520px]">
      <div class="flex items-center justify-between pb-2 border-b border-slate-200 mb-3">
        <div class="flex items-center space-x-2">
          <span class="font-bold text-slate-800 text-sm sm:text-base" id="qNumberDisplay">Question 1</span>
          <span class="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-300">Mental Ability</span>
        </div>
        <div class="flex items-center space-x-2 text-[11px] font-semibold">
          <span class="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">+4</span>
          <span class="text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">-1</span>
        </div>
      </div>

      <!-- Question Text -->
      <div id="questionContainer" class="flex-1 text-slate-800 text-xs sm:text-sm leading-relaxed overflow-y-auto custom-scroll pr-1"></div>

      <!-- Action Buttons -->
      <div class="pt-3 border-t border-slate-200 mt-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center space-x-1.5">
          <button id="btnPrev" class="px-2.5 py-1.5 rounded border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold">Prev</button>
          <button id="btnNext" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">Save & Next</button>
        </div>
        <div class="flex items-center space-x-1.5">
          <button id="btnClear" class="px-2 py-1.5 rounded border border-slate-300 text-slate-600 hover:text-slate-900 text-xs">Clear</button>
          <button id="btnMarkReview" class="px-2.5 py-1.5 rounded bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium">Review</button>
        </div>
      </div>
    </div>

    <!-- Palette -->
    <aside class="w-full lg:w-80 bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col shrink-0">
      <h2 class="font-bold text-slate-800 text-xs mb-2">Question Palette (100 Questions)</h2>
      <div class="grid grid-cols-2 gap-1.5 text-[10px] text-slate-600 mb-2 pb-2 border-b border-slate-200">
        <div class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded bg-emerald-500"></span><span>Answered</span></div>
        <div class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded bg-amber-500"></span><span>Review</span></div>
        <div class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded bg-rose-500"></span><span>Unanswered</span></div>
        <div class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded bg-slate-200 border"></span><span>Not Visited</span></div>
      </div>
      <div id="paletteGrid" class="grid grid-cols-10 lg:grid-cols-8 gap-1 overflow-y-auto max-h-[300px] lg:max-h-[470px] custom-scroll p-1"></div>
    </aside>
  </main>

  <!-- Result Modal -->
  <div id="resultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-white rounded-xl max-w-2xl w-full p-4 sm:p-6 shadow-2xl max-h-[92vh] overflow-y-auto custom-scroll">
      <div class="text-center pb-3 border-b border-slate-200">
        <span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Official Results</span>
        <h2 class="text-xl font-black text-slate-900 mt-1">Class 10 Mental Ability Practice Test</h2>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 my-4">
        <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-2 text-center">
          <span class="text-[10px] font-semibold text-indigo-600 block">Total Score</span>
          <span id="resTotalScore" class="text-lg font-black text-indigo-900">0 / 400</span>
        </div>
        <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2 text-center">
          <span class="text-[10px] font-semibold text-emerald-600 block">Correct (+4)</span>
          <span id="resCorrect" class="text-lg font-black text-emerald-900">0</span>
        </div>
        <div class="bg-rose-50 border border-rose-200 rounded-lg p-2 text-center">
          <span class="text-[10px] font-semibold text-rose-600 block">Wrong (-1)</span>
          <span id="resIncorrect" class="text-lg font-black text-rose-900">0</span>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-2 text-center">
          <span class="text-[10px] font-semibold text-slate-600 block">Unattempted</span>
          <span id="resUnattempted" class="text-lg font-black text-slate-800">0</span>
        </div>
      </div>
      <div class="flex justify-end pt-2 border-t border-slate-200">
        <button id="btnReviewSolutions" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-4 py-2 rounded-lg">
          Review Answers with Official Key
        </button>
      </div>
    </div>
  </div>

      { text: "A, B, C, D, E and F are seated in a circle facing the centre. D is between F and B. A is second to the left of D and second to the right of E. Who is facing A?", opts: ["B", "D", "F", "Either F or B"] },
      { text: "Pointing to a photograph Stella says, 'He is the son of the only son of my grandmother and I am the only daughter of my parents'. How is the man in the photograph related to Stella?", opts: ["Brother", "Uncle", "Cousin", "Nephew"] },
      { text: "There is a ring road connecting points A, B, C and D. The road is in a complete circular form but having several approach roads leading to the centre. Exactly in the centre of the ring road, there is a tree which is 20 km from point A on the circular road. You have taken a round of the circular road starting from point A and finish at the same point after touching points B, C and D. You then drive 20 km interior towards the tree from point A and from there reach somewhere in between B and C on the ring road. How much distance you have to travel from the tree to reach the point between B and C on the ring road?", opts: ["20km", "15km", "80km", "40km"] },
      { text: "Find the missing character:" + SVGS.q56, opts: ["2", "3", "4", "1"] },
      { text: "If 453945 stands for DECIDE, then what will stand for 8978?", opts: ["BHEE", "CDEH", "GHEE", "HIGH"] },
      { text: "Anjali and Laxmi are good in Maths and Athletics. Dimple and Anjali are good in Athletics and Studies. Laxmi and Babita are good in GK and Maths. Dimple, Babita and Eshani are good in studies and GK. Eshani and Dimple are good in studies and Biology.<br>Who is good in studies, GK, Athletics and Biology?", opts: ["Anjali", "Babita", "Laxmi", "Dimple"] },
      { text: "In the given question below, you are given a figure (X) followed by four figures (1), (2), (3) and (4) such that (X) is embedded in one of them. Trace out the correct alternative:" + SVGS.q59_x, opts: [SVGS.q59_1 + "<span>(1)</span>", SVGS.q59_2 + "<span>(2)</span>", SVGS.q59_3 + "<span>(3)</span>", SVGS.q59_4 + "<span>(4)</span>"] },
      { text: "Statements:<br>Some pencils are pens.<br>All pens are buses.<br>Some buses are trucks.<br>Conclusions:<br>I. Some trucks are pencils.<br>II. Some buses are pencils.<br>III. No truck is pencil.", opts: ["Only I follows", "Only II follows", "Either I or III and II follows", "Either I or III follows"] },
      { text: "Babita is Ajay's wife and Chiranjiv is Divya's father. If Ajay's mother-in-law is wife of Divya's grandfather, then what is the relation of Babita with Chiranjiv's wife?", opts: ["Sister-in-law", "Sister", "Cousin", "Nephew"] },
      { text: "If 14th February, 2011 falls on Monday then what will be the day on 14th February, 2013?", opts: ["Friday", "Tuesday", "Wednesday", "Thursday"] },
      { text: "If P > Q, Q > R & R > S, then which of the following conclusions is definitely wrong?", opts: ["P > S", "P > R", "S > P", "Q > S"] },
      { text: "Direction (Q.64-65): In these questions, symbols are used:<br><strong>□</strong> for 'not less than' (≥); <strong>⊙</strong> for 'greater than' (>); <strong>×</strong> for 'not equal to' (≠); <strong>+</strong> for 'not greater than' (≤); <strong>©</strong> for 'equal to' (=); <strong>Δ</strong> for 'less than' (<).<br><br>If <strong>x □ y × z</strong>, it implies that:", opts: ["x ⊙ y φ z", "x Δ y © z", "x × z + y", "z × y × x"] },
      { text: "If <strong>x × y Δ z</strong>, it follows that:", opts: ["z + y ⊙ x", "x ⊙ y + z", "y © x × z", "x φ z Δ y"] },
      { text: "In a certain code language, if SOME = 13, CAN = 6, then PAINT = ?", opts: ["15", "60", "12", "20"] },
      { text: "Find the rectangles in the given figure:" + SVGS.q67, opts: ["25", "29", "28", "None of these"] },
      { text: "Dev is introducing Manish to Rohini. He said, 'He is the son of your father's only son-in-law'. How is Rohini related to Manish?", opts: ["Daughter", "Aunt", "Sister", "Mother"] },
      { text: "In the market, some shops are located at a certain distance. The Fish stall is 10m North of the Vegetable shop which is 8m West of the Fruits shop. Spinach shop is 15m East of Grains shop which is 18m North of Fruits shop. The Meat shop is exactly between the Vegetable shop and the Fruit shop.<br>If the Vegetable shop is shifted to the Fish stall, then the Fish stall is shifted to the Fruits shop, then the Fruits shop is shifted to the Vegetable shop. Then what is the direction of the Vegetable shop with respect to the Grains shop? If the Flower shop is 10m North of the Fish stall, then what is the distance between the Spinach shop and Flower shop (Calculate after interchanging)?", opts: ["South-West, 23m", "South-East, 17m", "North-East, 23m", "South-West, 17m"] },
      { text: "Trace out the alternative figure which contains figure (X) as its part:" + SVGS.q70_x, opts: [SVGS.q70_1 + "<span>(1)</span>", SVGS.q70_2 + "<span>(2)</span>", SVGS.q70_3 + "<span>(3)</span>", SVGS.q70_4 + "<span>(4)</span>"] },
      { text: "In the following question, each shape represents a digit, different shapes replace different digits and same shapes replace the same digit. What is the sum of the 'Square' and the 'circle'?" + SVGS.q71, opts: ["6", "7", "8", "9"] },
      { text: "Find the missing term in the given figure:" + SVGS.q72, opts: ["4", "7", "10", "11"] },
      { text: "Direction: 'K @ J' means K ≥ J; 'K % J' means K > J; 'K $ J' means K = J.<br>Statements: <strong>N @ I, I % G, G $ P</strong><br>Conclusions: I. P < N &nbsp;&nbsp; II. G < N", opts: ["If only conclusion I is true", "If only conclusion II is true", "If either conclusion I or II is true", "If both conclusions I and II are true"] },
      { text: "Statements: <strong>S % Q, Y @ Q, Y @ U</strong><br>Conclusions: I. U < Q &nbsp;&nbsp; II. U = Q", opts: ["If only conclusion I is true", "If only conclusion II is true", "If either conclusion I or II is true", "If both conclusions I and II are true"] },
      { text: "Find the next figure in the series from the given answer figures to complete the series:" + SVGS.q75_prob, opts: [SVGS.q75_1 + "<span>(1)</span>", SVGS.q75_2 + "<span>(2)</span>", SVGS.q75_3 + "<span>(3)</span>", SVGS.q75_4 + "<span>(4)</span>"] },
      { text: "In a row of thirty boys, P is fourth from the right end and W is tenth from the left end. How many boys are there between P and W?", opts: ["15", "16", "17", "20"] },
      { text: "A certain number of persons were sitting in a row facing North such that number of persons to the right of Roop was same as the number of persons on the left of Gaur. Gaur sits to the left of Roop. Deep sits exactly in the middle of Roop and Gaur and number of persons between Deep and Roop were twice the number of persons on the right of Roop, who was 58th from the left end. What is the position of Deep from the right end of the row?", opts: ["20th", "25th", "30th", "35th"] },
      { text: "Six persons A, B, C, D, E and F were playing a game of cards. A's father, mother and uncle were in the group. There were two women. B, the mother of A, got more points than her husband. D got more points than E but less than F. Niece of E got lowest points. Father of A got more points than F but could not win the game. Who won the game?", opts: ["A", "B", "D", "F"] },
      { text: "Abraham, Border, Charlie, Dennis and Elmer and their respective wives recently dined together and were seated at a circular table. The seats were so arranged that men and women alternated and each woman was three places distant from her husband. Mrs. Charlie sat to the immediate left of Mr. Abraham. Mrs. Elmer sat two places to the right of Mrs. Border. Who sat to the right of Mr. Abraham?", opts: ["Mrs. Dennis", "Mrs. Elmer", "Mrs. Border", "Mrs. Border or Mrs. Dennis"] },
      { text: "Statements:<br>All animals are human.<br>All tigers are human.<br>Conclusions:<br>I. Some tigers are animals.<br>II. No tiger is animals.", opts: ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows"] },
      { text: "Pointing to a person in a photograph, a lady said, 'His sister is the daughter of my father's son's mother'. How is the person related to the lady?", opts: ["Sister", "Brother", "Nephew", "Father"] },
      { text: "If 20th February, 1996, which is your date of birth, is a Tuesday. On what day of the week will your birthday fall in the year 1998?", opts: ["Thursday", "Tuesday", "Saturday", "Friday"] },
      { text: "Information: <strong>α, β, γ, δ, ε, φ, ψ, η</strong> are sitting on a merry-go-round facing at the centre. δ is second to the left of η who is third to the left of α. ε is fourth to the right of γ who is immediate neighbour of η. ψ is not the neighbour of β or δ. φ is not a neighbour of α.<br><br>Who is third to the left of β?", opts: ["α", "γ", "φ", "ψ"] },
      { text: "In which of the following pairs is the first person sitting to the immediate right of the second person?", opts: ["δ, ψ", "β, ε", "η, β", "ψ, η"] },
      { text: "Eight friends P, Q, R, S, T, U, V and W are sitting around a circle facing the centre. V is third to the right of Q and is second to the left of R. Q is second to the left of T and on the immediate right of S. U is between Q and T. P is not on the left of R. Which of the following is the correct position of W?", opts: ["On the immediate left of V", "On the immediate right of V", "Between U and V", "On the immediate right of R"] },
      { text: "If 'TOPPER' is coded as '8', 'INSTITUTION' is coded as '30', then what is the code of JEEADVANCED?", opts: ["55", "24", "30", "19"] },
      { text: "How many triangles are there in the following figure?" + SVGS.q87, opts: ["27", "28", "30", "None of these"] },
      { text: "Find the next term in the given series:<br><strong>6, 125, 12, 7, 64, 11, 8, 27, 10, 9, ?</strong>", opts: ["8", "9", "11", "10"] },
      { text: "Amay and Akshat are two friends studying in ITI. Amay starts walking from his house in North direction. After walking 120 m, he reached the coffee shop. Then he turns and walk 40 m in North-East direction. Then he turns 90° clockwise direction and walks 40 m to reach Akshat's house which is in the East of coffee shop. Then from Akshat's house both of them walk 120√2 m in South-East direction to reach temple which is East of Amay's house. What is the shortest distance between Amay's house and temple?", opts: ["40(3 + √2) m", "40(1 + 3√2) m", "5(5 + 24√2) m", "20(6 + √2) m"] },
      { text: "Which one of the answer figure is hidden in the following question figure?" + SVGS.q90_x, opts: [SVGS.q90_1 + "<span>(1)</span>", SVGS.q90_2 + "<span>(2)</span>", SVGS.q90_3 + "<span>(3)</span>", SVGS.q90_4 + "<span>(4)</span>"] },
      { text: "If x % y = y² - x², x $ y = x - y², x # y = 2xy, then value of <strong>{(13 % 5) $ 6} # 15</strong> is:", opts: ["480", "720", "-360", "-120"] },
      { text: "Find the missing number in the given figure:" + SVGS.q92, opts: ["48", "120", "27", "60"] },
      { text: "X, Y, Z, P are sitting around a circular table and discussing their trades:<br>(a) X sits opposite to Cook.<br>(b) Y sits right to the Barber.<br>(c) The Washerman is on the left of the Tailor.<br>(d) P sits opposite to Z.<br>What are the trades of X and Y?", opts: ["Tailor and Barber", "Barber and Cook", "Tailor and Cook", "Tailor and Washerman"] },
      { text: "Six students are sitting in a row. K is sitting between V and R. V is sitting next to M. M is sitting next to B who is sitting on the extreme left and Q is sitting next to R. Who are sitting adjacent to V?", opts: ["R and Q", "B and M", "K and R", "M and K"] },
      { text: "If Ajay finds that he is 15th from the right in a line of boys and 6th from the left, how many boys should be added to the line such that there are 38 boys in the line?", opts: ["18", "19", "17", "20"] },
      { text: "In a packet, the number of sticks is twice that of balls and all of these are arranged in a row. There is a Red ball and its rank is 18th from the top. Suppose there are 9 sticks ahead of Red ball. If the total articles in the packet are 42, then find the number of balls behind Red ball in the ranking order?", opts: ["7", "6", "5", "8"] },
      { text: "If 3 is subtracted from the middle digit of each of the following numbers and then the positions of the digits are reversed, which of the following will be the last digit of the middle number after they are arranged in descending order?<br><strong>589 &nbsp; 362 &nbsp; 554 &nbsp; 371 &nbsp; 442</strong>", opts: ["1", "2", "3", "4"] },
      { text: "Five friends P, Q, R, S and T have different heights. T is 2nd tallest person in the group. P is taller than only S. R and T both are taller than Q. P is taller than S but shorter than Q. Who is the tallest person of all?", opts: ["R or T", "T", "R", "Q"] },
      { text: "A, B, C, D, E, F, G and H are sitting around a round table facing centre. There are four male person and four female person in the group. But no two male and no two female are immediate neighbour. A is the wife of H and she is sitting third to the left of E. F is second to the right of D. D is not immediate neighbour of A and E. H is sitting beside C. F and his wife B are not sitting beside.<br>What will be true about 'G' in the given options?", opts: ["G is a male person", "G is sitting between F and H", "G is third to the left of E", "G is sitting second to the right of B"] },
      { text: "Statements:<br>All dogs are fruits.<br>No chair is fruit.<br>Some chairs are clowns.<br>Conclusions:<br>I. Some clowns are dogs.<br>II. Some chairs are dogs.<br>III. No chair is dog.<br>IV. No dog is clown.", opts: ["Either I or IV follows", "Either I or IV and III follow", "Either I or IV and II follow", "Either II or III follows and either I or IV follow"] }
    ];

    const questionsData = rawQuestions.map((q, idx) => ({
      qId: idx + 1,
      text: q.text,
      options: q.opts,
      correct: officialAns[idx]
    }));

    // State Variables
    let currentIdx = 0;
    const userResponses = {};
    let timeRemainingSeconds = 150 * 60; // 150 Minutes
    let timerInterval = null;
    let isTimerPaused = false;
    let isSubmitted = false;

    questionsData.forEach(q => {
      userResponses[q.qId] = { selectedOption: null, markedForReview: false, visited: false };
    });

    const ranges = [
      { name: "Q1 - Q20", start: 0 },
      { name: "Q21 - Q40", start: 20 },
      { name: "Q41 - Q60", start: 40 },
      { name: "Q61 - Q80", start: 60 },
      { name: "Q81 - Q100", start: 80 }
    ];

    function initRangeTabs() {
      const bar = document.getElementById("rangeTabs");
      bar.innerHTML = "";
      ranges.forEach((r, idx) => {
        const btn = document.createElement("button");
        btn.id = `range-tab-${idx}`;
        btn.className = `px-3 py-1 text-xs font-semibold rounded whitespace-nowrap transition ${
          idx === 0 ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
        }`;
        btn.textContent = r.name;
        btn.onclick = () => jumpToQuestion(r.start);
        bar.appendChild(btn);
      });
    }

    function updateRangeTabs() {
      const activeRangeIdx = Math.floor(currentIdx / 20);
      ranges.forEach((_, idx) => {
        const tab = document.getElementById(`range-tab-${idx}`);
        if (tab) {
          tab.className = idx === activeRangeIdx
            ? "px-3 py-1 text-xs font-semibold rounded whitespace-nowrap bg-indigo-600 text-white"
            : "px-3 py-1 text-xs font-semibold rounded whitespace-nowrap bg-slate-100 text-slate-700 hover:bg-slate-200";
        }
      });
    }

    function updateTimerDisplay() {
      const hrs = String(Math.floor(timeRemainingSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((timeRemainingSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(timeRemainingSeconds % 60).padStart(2, '0');
      document.getElementById("timerDisplay").textContent = `${hrs}:${mins}:${secs}`;
    }

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (!isTimerPaused) {
          if (timeRemainingSeconds > 0) {
            timeRemainingSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            alert("Time is up!");
            submitExam();
          }
        }
      }, 1000);
    }

    document.getElementById("btnPauseTimer").onclick = () => {
      if (isSubmitted) return;
      isTimerPaused = !isTimerPaused;
      const btn = document.getElementById("btnPauseTimer");
      if (isTimerPaused) {
        btn.textContent = "▶ Resume";
        btn.className = "bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-2.5 py-1.5 rounded shadow transition";
      } else {
        btn.textContent = "⏸ Pause";
        btn.className = "bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-2.5 py-1.5 rounded shadow transition";
      }
    };

    function renderQuestion(idx) {
      currentIdx = idx;
      const q = questionsData[idx];
      const resp = userResponses[q.qId];
      resp.visited = true;

      document.getElementById("qNumberDisplay").textContent = `Question ${q.qId} of 100`;

      let html = `<div class="mb-3 font-medium text-slate-900">${q.text}</div><div class="space-y-2">`;
      q.options.forEach((optText, oIdx) => {
        const isChecked = resp.selectedOption === oIdx;
        html += `
          <label class="flex items-center p-2.5 rounded-lg border cursor-pointer transition ${
            isChecked ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500 font-medium' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'
          }">
            <input type="radio" name="optRadio" value="${oIdx}" ${isChecked ? 'checked' : ''} class="mr-2.5 text-indigo-600 shrink-0" onchange="selectOption(${oIdx})">
            <span class="flex-1 flex items-center">${optText}</span>
          </label>`;
      });
      html += `</div>`;

      if (isSubmitted) {
        const isCorrect = resp.selectedOption === q.correct;
        html += `
          <div class="mt-4 p-3 rounded-lg border text-xs ${isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}">
            <strong>${isCorrect ? '✓ Correct Answer' : '✕ Incorrect / Unattempted'}</strong><br>
            Official Answer Key: <strong>Option (${q.correct + 1})</strong>
          </div>`;
      }

      document.getElementById("questionContainer").innerHTML = html;
      updatePalette();
      updateRangeTabs();
    }

    function selectOption(optIdx) {
      if (isSubmitted) return;
      userResponses[questionsData[currentIdx].qId].selectedOption = optIdx;
      renderQuestion(currentIdx);
    }

    function jumpToQuestion(idx) {
      if (idx >= 0 && idx < questionsData.length) {
        renderQuestion(idx);
      }
    }

    function updatePalette() {
      const palette = document.getElementById("paletteGrid");
      palette.innerHTML = "";
      questionsData.forEach((q, i) => {
        const r = userResponses[q.qId];
        let colorClass = "bg-slate-100 text-slate-700 border-slate-300";
        if (r.markedForReview) colorClass = "bg-amber-500 text-white border-amber-600";
        else if (r.selectedOption !== null) colorClass = "bg-emerald-600 text-white border-emerald-700";
        else if (r.visited) colorClass = "bg-rose-500 text-white border-rose-600";

        const btn = document.createElement("button");
        btn.className = `h-6 text-[10px] rounded border flex items-center justify-center font-bold ${colorClass} ${
          i === currentIdx ? 'ring-2 ring-indigo-500 ring-offset-1' : ''
        }`;
        btn.textContent = q.qId;
        btn.onclick = () => jumpToQuestion(i);
        palette.appendChild(btn);
      });
    }

    document.getElementById("btnNext").onclick = () => {
      if (currentIdx < questionsData.length - 1) jumpToQuestion(currentIdx + 1);
    };
    document.getElementById("btnPrev").onclick = () => {
      if (currentIdx > 0) jumpToQuestion(currentIdx - 1);
    };
    document.getElementById("btnClear").onclick = () => {
      if (isSubmitted) return;
      userResponses[questionsData[currentIdx].qId].selectedOption = null;
      renderQuestion(currentIdx);
    };
    document.getElementById("btnMarkReview").onclick = () => {
      if (isSubmitted) return;
      const r = userResponses[questionsData[currentIdx].qId];
      r.markedForReview = !r.markedForReview;
      renderQuestion(currentIdx);
    };
    document.getElementById("btnSubmitExam").onclick = () => {
      if (confirm("Are you sure you want to submit the exam?")) submitExam();
    };

    function submitExam() {
      if (isSubmitted) return;
      isSubmitted = true;
      clearInterval(timerInterval);

      let totalScore = 0, totalCorrect = 0, totalIncorrect = 0, totalUnattempted = 0;

      questionsData.forEach(q => {
        const r = userResponses[q.qId];
        if (r.selectedOption === null) {
          totalUnattempted++;
        } else if (r.selectedOption === q.correct) {
          totalCorrect++;
          totalScore += 4;
        } else {
          totalIncorrect++;
          totalScore -= 1;
        }
      });

      document.getElementById("resTotalScore").textContent = `${totalScore} / 400`;
      document.getElementById("resCorrect").textContent = totalCorrect;
      document.getElementById("resIncorrect").textContent = totalIncorrect;
      document.getElementById("resUnattempted").textContent = totalUnattempted;

      document.getElementById("resultModal").classList.remove("hidden");
      document.getElementById("btnSubmitExam").classList.add("hidden");
      document.getElementById("btnPauseTimer").classList.add("hidden");
      renderQuestion(currentIdx);
    }

    document.getElementById("btnReviewSolutions").onclick = () => {
      document.getElementById("resultModal").classList.add("hidden");
      renderQuestion(0);
    };

    initRangeTabs();
    renderQuestion(0);
    startTimer();
  </script>
</body>
</html>
